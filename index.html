<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Open when ready to smile 💗</title>
<meta name="description" content="Open when ready to smile 💗">

<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one phone-sized stage (max 420px) holding stacked full-height scenes that zoom/fade into each other. Single committed light "strawberry milk" look. */
:root{
  --milk:#fff3f5;      /* page ground */
  --blush:#ffc9d6;     /* cheeks, soft fills */
  --berry:#ff6f91;     /* primary buttons */
  --cocoa:#5a3a3f;     /* outlines + text */
  --butter:#ffe7a3;    /* warm highlight */
  --cloud:#ffffff;
  --mochi-pink:#ffe1e8;
  --mochi-grey:#efe9e6;
  --font-cute:"Gaegu","Comic Sans MS","Chalkboard SE",cursive;
  --font-body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--milk);color:var(--cocoa);font-family:var(--font-body);overflow:hidden;
  background-image:radial-gradient(var(--blush) 1.2px,transparent 1.4px);background-size:22px 22px}
.stage{position:relative;height:100%;max-width:420px;margin:0 auto;overflow:hidden;background:var(--milk);
  box-shadow:0 0 0 1px rgba(90,58,63,.06),0 10px 40px rgba(255,111,145,.12)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  text-align:center;opacity:0;transform:scale(1.12);pointer-events:none;
  transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.scene.on{opacity:1;transform:scale(1);pointer-events:auto}
.scene.gone{opacity:0;transform:scale(.35) rotate(-6deg);pointer-events:none}
h1,h2{font-family:var(--font-cute);font-weight:700;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(34px,10vw,44px)}
h2{font-size:clamp(32px,9.5vw,42px)}
p{margin:0}
.reveal{opacity:0;transform:translateY(10px)}
.scene.on .reveal{animation:rise .7s ease forwards}
.scene.on .reveal.d1{animation-delay:.45s}.scene.on .reveal.d2{animation-delay:.9s}.scene.on .reveal.d3{animation-delay:1.3s}
@keyframes rise{to{opacity:1;transform:none}}
.btn{font-family:var(--font-cute);font-weight:700;font-size:26px;color:var(--cloud);background:var(--berry);
  border:3px solid var(--cocoa);border-radius:999px;padding:8px 34px 10px;cursor:pointer;
  box-shadow:0 5px 0 var(--cocoa);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cocoa)}
.btn:focus-visible{outline:3px dashed var(--berry);outline-offset:5px}
.btn.alt{background:var(--butter);color:var(--cocoa)}
.row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}

/* scene 1 */
.face{position:relative;width:min(300px,78vw);aspect-ratio:1;max-width:100%}
.face svg,.face img{width:100%;height:100%;object-fit:contain;display:block}
.cheek{position:absolute;width:30%;height:26%;top:52%;border-radius:50%;background:transparent;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cheek.l{left:9%}.cheek.r{right:9%}
.cheek:focus-visible{outline:3px dashed var(--berry)}
.face.squish{animation:squish .45s ease}
@keyframes squish{30%{transform:scale(1.08,.9)}60%{transform:scale(.96,1.05)}100%{transform:none}}
.hint{font-family:var(--font-cute);font-size:20px;opacity:.75;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pop{position:absolute;pointer-events:none;font-size:26px;animation:pop 900ms ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),-90px) scale(1.4);opacity:0}}

/* slideshow */
.slides{position:relative;width:min(290px,76vw);aspect-ratio:1;max-width:100%;border:3px solid var(--cocoa);border-radius:28px;
  background:var(--cloud);overflow:hidden;box-shadow:0 6px 0 var(--blush)}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .6s}
.slide.show{opacity:1}
.slide img,.slide svg{width:100%;height:100%;object-fit:cover}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--blush);transition:background .3s,width .3s}
.dots i.on{background:var(--berry);width:22px;border-radius:6px}
.plea{font-family:var(--font-cute);font-size:26px;line-height:1.15;max-width:30ch}

/* couple */
.couple{position:absolute;right:max(6px,env(safe-area-inset-right,0px));bottom:6px;width:min(220px,56vw)}
.couple svg,.couple img{width:100%;display:block}
.hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hearts span{position:absolute;bottom:-30px;font-size:20px;color:var(--berry);animation:float linear infinite}
@keyframes float{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.top{margin-bottom:28vh}

/* camera */
.snapper{width:min(230px,62vw);max-width:100%}
.snapper svg,.snapper img{width:100%;display:block}
.cam{display:none;position:relative;width:min(300px,80vw);aspect-ratio:3/4;border:4px solid var(--cocoa);border-radius:26px;overflow:hidden;background:var(--cocoa);box-shadow:0 6px 0 var(--berry)}
.cam.on{display:block;animation:rise .5s ease forwards}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam img{transform:none}
.cam .tag{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);white-space:nowrap;font-family:var(--font-cute);font-weight:700;font-size:26px;
  background:var(--cloud);color:var(--cocoa);border:3px solid var(--cocoa);border-radius:999px;padding:2px 18px 4px}
.note{font-size:13px;opacity:.7;max-width:30ch}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div class="stage" id="stage">

  <section class="scene on" id="s1" aria-label="Start">
    <h1>pat my cheeks<br>to see magic ✨</h1>
    <div class="face" id="face">
      <div id="faceArt"></div>
      <button class="cheek l" aria-label="Pat left cheek"></button>
      <button class="cheek r" aria-label="Pat right cheek"></button>
    </div>
    <p class="hint">tap tap 👆</p>
  </section>

  <section class="scene" id="s2" aria-label="Question">
    <div class="reveal" id="grumpArt" style="width:min(190px,50vw)"></div>
    <h2 class="reveal d1">bubu ap gussa ho?</h2>
    <div class="row reveal d2">
      <button class="btn" id="yes">Yes</button>
      <button class="btn alt" id="no">No</button>
    </div>
  </section>

  <section class="scene" id="s3" aria-label="Sorry">
    <div class="slides reveal" id="slides"></div>
    <div class="dots reveal" id="dots"></div>
    <p class="plea reveal d1">Man jao na, ap ni manoge to m sorry bolti rhungi! 🥺</p>
    <button class="btn reveal d2" id="ok1">OK</button>
  </section>

  <section class="scene" id="s4" aria-label="Good bubu">
    <div class="hearts" id="hearts"></div>
    <div class="top" style="display:flex;flex-direction:column;gap:22px;align-items:center">
      <h2 class="reveal">good bubu! gussa ni krte,<br>i villu 💗</h2>
      <button class="btn reveal d1" id="ok2">OK</button>
    </div>
    <div class="couple reveal d1" id="coupleArt"></div>
  </section>

  <section class="scene" id="s5" aria-label="Favourite">
    <h2 class="reveal">Apko pta hai mera<br>favourite kon hai?</h2>
    <div class="snapper reveal d1" id="snapArt"></div>
    <div class="cam" id="cam">
      <video id="video" autoplay playsinline muted></video>
      <img id="shot" alt="" hidden>
      <span class="tag">ye wala 💗</span>
    </div>
    <button class="btn reveal d2" id="ok3">OK</button>
    <label class="btn alt" id="camFallback" for="capture" hidden>Open camera 📷</label>
    <input type="file" id="capture" accept="image/*" capture="user" hidden>
    <p class="note" id="camNote" hidden></p>
  </section>
</div>

<script>
/* ---------- Your pictures ----------
   Paste an image link (or a data: URI) in any slot below.
   Empty slots show the built-in cartoon instead. */
const PICS = {
  face:   "",            // screen 1: face with cheeks
  angry:  "",            // screen 2: angry one
  sorry:  ["", "", "", ""], // screen 3: slideshow pictures
  couple: "",            // screen 4: couple picture (bottom corner)
  camera: ""             // screen 5: clicking a photo
};

/* ---------- original mochi cartoon ---------- */
const C = getComputedStyle(document.documentElement);
const tok = n => C.getPropertyValue(n).trim();
function mochi({fill, mood="happy", bow=false, cam=false, sign="", w=200, h=190}={}){
  const ink = tok("--cocoa"), blush = tok("--blush"), berry = tok("--berry");
  const eyes = {
    happy:`<path d="M66 98q9-11 18 0M116 98q9-11 18 0" stroke="${ink}" stroke-width="5" fill="none" stroke-linecap="round"/>`,
    sad:`<circle cx="76" cy="98" r="7" fill="${ink}"/><circle cx="124" cy="98" r="7" fill="${ink}"/><circle cx="79" cy="95" r="2.4" fill="#fff"/><circle cx="127" cy="95" r="2.4" fill="#fff"/>
         <path d="M70 84l14 5M130 84l-14 5" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>
         <path d="M72 108q-4 10 0 14q4-4 0-14z" fill="#8fd3ff"/>`,
    grumpy:`<path d="M64 84l22 9M136 84l-22 9" stroke="${ink}" stroke-width="5" stroke-linecap="round"/>
         <circle cx="77" cy="100" r="6" fill="${ink}"/><circle cx="123" cy="100" r="6" fill="${ink}"/>
         <path d="M150 52l8-10M158 60l12-4M146 44l2-12" stroke="${berry}" stroke-width="4" stroke-linecap="round"/>`,
    love:`<path d="M76 104l-9-9a5.5 5.5 0 0 1 9-6 5.5 5.5 0 0 1 9 6z M124 104l-9-9a5.5 5.5 0 0 1 9-6 5.5 5.5 0 0 1 9 6z" fill="${berry}"/>`
  }[mood];
  const mouth = {happy:"M90 118q10 10 20 0", sad:"M90 126q10-9 20 0", grumpy:"M88 124q12-7 24 0", love:"M90 116q10 12 20 0"}[mood];
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cute mochi">
    <ellipse cx="100" cy="176" rx="70" ry="8" fill="${blush}" opacity=".5"/>
    <path d="M100 32C160 32 188 76 186 120c-2 38-36 52-86 52S16 158 14 120C12 76 40 32 100 32z" fill="${fill}" stroke="${ink}" stroke-width="5"/>
    ${bow?`<path d="M100 36l-22-14c-6-4-12 2-8 8l8 10zM100 36l22-14c6-4 12 2 8 8l-8 10z" fill="${berry}" stroke="${ink}" stroke-width="4" stroke-linejoin="round"/><circle cx="100" cy="36" r="6" fill="${berry}" stroke="${ink}" stroke-width="4"/>`:""}
    ${eyes}
    <ellipse cx="54" cy="120" rx="15" ry="9" fill="${blush}"/><ellipse cx="146" cy="120" rx="15" ry="9" fill="${blush}"/>
    <path d="${mouth}" stroke="${ink}" stroke-width="5" fill="none" stroke-linecap="round"/>
    ${cam?`<g transform="translate(62 128)"><rect x="0" y="6" width="76" height="46" rx="10" fill="${tok("--butter")}" stroke="${ink}" stroke-width="4"/>
      <rect x="10" y="0" width="20" height="10" rx="3" fill="${ink}"/><circle cx="38" cy="29" r="15" fill="#fff" stroke="${ink}" stroke-width="4"/><circle cx="38" cy="29" r="7" fill="${ink}"/>
      <circle cx="64" cy="16" r="4" fill="${berry}"/></g>
      <path d="M150 48l6-14M162 58l14-6M158 40l10-10" stroke="${tok("--butter")}" stroke-width="5" stroke-linecap="round"/>`:""}
    ${sign?`<g transform="translate(40 136) rotate(-4)"><rect width="120" height="40" rx="10" fill="#fff" stroke="${ink}" stroke-width="4"/>
      <text x="60" y="28" text-anchor="middle" font-family="Gaegu, cursive" font-weight="700" font-size="24" fill="${ink}">${sign}</text></g>`:""}
  </svg>`;
}
const art = (src, svg, alt) => src ? `<img src="${src}" alt="${alt}">` : svg;
const PINK = tok("--mochi-pink"), GREY = tok("--mochi-grey");

document.getElementById("faceArt").innerHTML = art(PICS.face, mochi({fill:PINK,bow:true}), "bubu");
document.getElementById("grumpArt").innerHTML = art(PICS.angry, mochi({fill:GREY,mood:"grumpy"}), "angry");
document.getElementById("snapArt").innerHTML = art(PICS.camera, mochi({fill:PINK,bow:true,cam:true}), "clicking a photo");
document.getElementById("coupleArt").innerHTML = PICS.couple ? `<img src="${PICS.couple}" alt="couple">` :
  `<svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
     <g transform="translate(130 10) scale(.98)">${mochi({fill:GREY,mood:"love"}).replace(/<\/?svg[^>]*>/g,"")}</g>
     <g transform="translate(0 30) scale(.85)">${mochi({fill:PINK,mood:"happy",bow:true}).replace(/<\/?svg[^>]*>/g,"")}</g>
     <path d="M168 40l-10-10a6 6 0 0 1 10-7 6 6 0 0 1 10 7z" fill="${tok("--berry")}"/>
   </svg>`;

/* slideshow */
const pleas = ["sorry 🥺","maaf kardo","pleaseee","sorry sorry"];
const slidesEl = document.getElementById("slides"), dotsEl = document.getElementById("dots");
PICS.sorry.forEach((src,i)=>{
  const s = document.createElement("div"); s.className = "slide" + (i?"":" show");
  s.innerHTML = art(src, mochi({fill:i%2?GREY:PINK,mood:"sad",bow:!(i%2),sign:pleas[i%pleas.length]}), "sorry");
  slidesEl.appendChild(s); dotsEl.appendChild(document.createElement("i"));
});
dotsEl.firstChild.className = "on";
let slideTimer;
function runSlides(){
  let i = 0; const s = slidesEl.children, d = dotsEl.children;
  clearInterval(slideTimer);
  slideTimer = setInterval(()=>{ s[i].classList.remove("show"); d[i].className="";
    i = (i+1)%s.length; s[i].classList.add("show"); d[i].className="on"; }, 2200);
}

/* navigation */
let current = document.getElementById("s1");
function go(id){
  const next = document.getElementById(id);
  current.classList.remove("on"); current.classList.add("gone");
  next.classList.remove("gone"); next.classList.add("on");
  current = next;
  if(id==="s3") runSlides(); else clearInterval(slideTimer);
  if(id==="s4") hearts();
}

/* scene 1: pat the cheeks */
const face = document.getElementById("face");
let patted = false;
face.querySelectorAll(".cheek").forEach(b=>b.addEventListener("click",e=>{
  if(patted) return; patted = true;
  face.classList.remove("squish"); void face.offsetWidth; face.classList.add("squish");
  const r = face.getBoundingClientRect(), st = document.getElementById("stage").getBoundingClientRect();
  for(let k=0;k<5;k++){
    const p = document.createElement("span"); p.className="pop"; p.textContent = ["💗","✨","💕"][k%3];
    p.style.left = (e.clientX - st.left - 12)+"px"; p.style.top = (e.clientY - st.top - 12)+"px";
    p.style.setProperty("--dx",(k-2)*22+"px");
    document.getElementById("stage").appendChild(p); setTimeout(()=>p.remove(),950);
  }
  setTimeout(()=>go("s2"),700);
}));

document.getElementById("yes").onclick = ()=>go("s3");
document.getElementById("no").onclick  = ()=>go("s4");
document.getElementById("ok1").onclick = ()=>go("s4");
document.getElementById("ok2").onclick = ()=>go("s5");

function hearts(){
  const h = document.getElementById("hearts"); if(h.childElementCount) return;
  for(let i=0;i<14;i++){
    const s = document.createElement("span"); s.textContent = i%3?"♥":"💗";
    s.style.left = Math.random()*100+"%"; s.style.animationDuration = 5+Math.random()*5+"s";
    s.style.animationDelay = -Math.random()*8+"s"; s.style.fontSize = 14+Math.random()*16+"px";
    h.appendChild(s);
  }
}

/* scene 5: front camera */
const cam = document.getElementById("cam"), video = document.getElementById("video"),
      shot = document.getElementById("shot"), ok3 = document.getElementById("ok3"),
      fb = document.getElementById("camFallback"), note = document.getElementById("camNote");
function showCam(){ document.getElementById("snapArt").hidden = true; cam.classList.add("on"); ok3.hidden = true; }
ok3.onclick = async ()=>{
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error("no camera api");
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
    video.srcObject = stream; showCam();
  }catch(err){
    ok3.hidden = true; fb.hidden = false;
    note.hidden = false; note.textContent = "Tap above to open the front camera 💕";
  }
};
document.getElementById("capture").addEventListener("change",e=>{
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{ shot.src = rd.result; shot.hidden = false; video.hidden = true; fb.hidden = true; note.hidden = true; showCam(); };
  rd.readAsDataURL(f);
});
</script>

</body>
</html>
